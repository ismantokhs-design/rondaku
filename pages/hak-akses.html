<div class="space-y-5">
  <!-- Greeting & Header Banner -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold text-white">Manajemen Hak Akses</h1>
      <p class="text-xs text-slate-400 mt-0.5">Kelola tingkat wewenang dan izin menu petugas</p>
    </div>
    <!-- Tombol Panah Kembali ke Home -->
    <button onclick="loadPage('home')" class="w-10 h-10 bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-300 rounded-2xl flex items-center justify-center transition shadow-md cursor-pointer" title="Kembali ke Beranda">
      <i class="fa-solid fa-arrow-left text-sm"></i>
    </button>
  </div>

  <!-- Header Banner Card -->
  <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-5 rounded-3xl shadow-lg shadow-indigo-500/20 text-white relative overflow-hidden flex items-center justify-between">
    <div>
      <div class="flex items-center space-x-2 bg-white/20 w-fit px-3 py-1 rounded-full text-xs font-semibold mb-2 backdrop-blur-sm">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Pengaturan Keamanan</span>
      </div>
      <h2 class="text-lg font-bold">Kontrol Akses Peran</h2>
      <p class="text-xs text-white/80 mt-1">Terhubung langsung dengan Firebase Firestore</p>
    </div>
    <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-2xl backdrop-blur-sm">
      <i class="fa-solid fa-key"></i>
    </div>
  </div>

  <!-- KONTEN HAK AKSES -->
  <div class="bg-slate-800/60 border border-slate-800 p-5 rounded-3xl space-y-5 pb-10">
    <div class="flex items-center space-x-2.5 text-indigo-400">
      <i class="fa-solid fa-user-lock text-lg"></i>
      <h3 class="font-bold text-sm text-white">Matriks Izin Akses Peran</h3>
    </div>

    <!-- Pilihan Peran -->
    <div>
      <label class="block text-xs font-medium text-slate-400 mb-1.5">Pilih Peran / Jabatan</label>
      <select id="role-selector" onchange="window.fetchRolePermissions()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition cursor-pointer">
        <option value="petugas">Petugas Ronda Jaga</option>
        <option value="koordinator">Koordinator / Ketua RT</option>
        <option value="admin">Admin Sistem Keamanan</option>
      </select>
    </div>

    <!-- Daftar Izin Menu (Checklist) -->
    <div class="space-y-3 pt-2">
      <p class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Hak Istimewa Menu &amp; Fitur</p>
      
      <div class="space-y-2.5">
        <label class="flex items-center justify-between bg-slate-900/80 border border-slate-700/60 p-3.5 rounded-2xl cursor-pointer hover:border-indigo-500/50 transition">
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-sm">
              <i class="fa-solid fa-house"></i>
            </div>
            <div>
              <p class="text-xs font-bold text-white">Akses Beranda &amp; Statistik</p>
              <p class="text-[10px] text-slate-400">Melihat ringkasan tugas dan status pos</p>
            </div>
          </div>
          <input type="checkbox" id="perm-home" checked class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0 cursor-pointer">
        </label>

        <label class="flex items-center justify-between bg-slate-900/80 border border-slate-700/60 p-3.5 rounded-2xl cursor-pointer hover:border-indigo-500/50 transition">
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-sm">
              <i class="fa-solid fa-calendar-days"></i>
            </div>
            <div>
              <p class="text-xs font-bold text-white">Jadwal Ronda &amp; Regu Jaga</p>
              <p class="text-[10px] text-slate-400">Melihat atau mengubah jadwal pasaran</p>
            </div>
          </div>
          <input type="checkbox" id="perm-jadwal" checked class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0 cursor-pointer">
        </label>

        <label class="flex items-center justify-between bg-slate-900/80 border border-slate-700/60 p-3.5 rounded-2xl cursor-pointer hover:border-indigo-500/50 transition">
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-sm">
              <i class="fa-solid fa-clipboard-list"></i>
            </div>
            <div>
              <p class="text-xs font-bold text-white">Laporan Warga &amp; Patroli</p>
              <p class="text-[10px] text-slate-400">Membuat dan memverifikasi laporan kejadian</p>
            </div>
          </div>
          <input type="checkbox" id="perm-laporan" checked class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0 cursor-pointer">
        </label>

        <label class="flex items-center justify-between bg-slate-900/80 border border-slate-700/60 p-3.5 rounded-2xl cursor-pointer hover:border-indigo-500/50 transition">
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-sm">
              <i class="fa-solid fa-qrcode"></i>
            </div>
            <div>
              <p class="text-xs font-bold text-white">Scan QR Code Titik Pos</p>
              <p class="text-[10px] text-slate-400">Melakukan absensi patroli keliling pos</p>
            </div>
          </div>
          <input type="checkbox" id="perm-scan" checked class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0 cursor-pointer">
        </label>

        <label class="flex items-center justify-between bg-slate-900/80 border border-slate-700/60 p-3.5 rounded-2xl cursor-pointer hover:border-indigo-500/50 transition">
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-sm">
              <i class="fa-solid fa-gear"></i>
            </div>
            <div>
              <p class="text-xs font-bold text-white">Pengaturan &amp; Konfigurasi Sistem</p>
              <p class="text-[10px] text-slate-400">Mengubah wilayah, jadwal pasaran, dan peraturan</p>
            </div>
          </div>
          <input type="checkbox" id="perm-setting" class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0 cursor-pointer">
        </label>

        <label class="flex items-center justify-between bg-slate-900/80 border border-slate-700/60 p-3.5 rounded-2xl cursor-pointer hover:border-indigo-500/50 transition">
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-xl bg-red-500/20 text-red-400 flex items-center justify-center text-sm">
              <i class="fa-solid fa-user-gear"></i>
            </div>
            <div>
              <p class="text-xs font-bold text-white">Manajemen User &amp; Hak Akses</p>
              <p class="text-[10px] text-slate-400">Menambah petugas dan mengatur tingkat akses</p>
            </div>
          </div>
          <input type="checkbox" id="perm-usermgmt" class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0 cursor-pointer">
        </label>
      </div>
    </div>

    <button onclick="window.saveHakAkses()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold py-3.5 rounded-xl text-sm shadow-lg shadow-indigo-600/30 transition transform active:scale-95 mt-4 cursor-pointer">
      Simpan Perubahan Hak Akses
    </button>
  </div>
</div>

<!-- SCRIPT INISIALISASI SAAT HALAMAN DIMUAT -->
<script>
  if (typeof window.fetchRolePermissions === 'function') {
    window.fetchRolePermissions();
  }
</script>
